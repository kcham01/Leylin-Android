name: Build and test Raidscribe
# Two machines at once: Android (APK, tested on an emulator) and Windows (installer, tested on Windows).
# Results: the "results" branch (Android) and the "results-windows" branch (Windows).
on:
  push:
    branches: [main]
    paths-ignore:   # changes to just these don't need a new build
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o raidscribe-src.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: bash ci/build.sh
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_B64: ${{ secrets.RAIDSCRIBE_KEYSTORE }}
          RAIDSCRIBE_KEYSTORE_PASSWORD: ${{ secrets.RAIDSCRIBE_KEYSTORE_PASSWORD }}
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          cd test && PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-audit --no-fund
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash test/run-emulator.sh
      - if: always()
        run: bash ci/publish.sh
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o raidscribe-src.zip || 7z x -y raidscribe-src.zip
        shell: bash
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash ci/windows.sh
        shell: bash
      - if: always()
        run: bash ci/publish-windows.sh
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
